# 内网Agent 配置样例：复制为 config.yaml 后填写真实值（config.yaml 不入库）

llm:
  # 大模型通道：dify（公司 Dify 网关）/ deepseek（DeepSeek 直连 API，OpenAI 兼容）
  provider: "dify"

dify:
  # Dify 部署地址 + /v1，例如 https://example.invalid/v1
  base_url: ""
  # Dify 应用的 API Key，形如 app-xxxxxxxx
  api_key: ""
  # 应用类型：chat（聊天助手/Chatflow）/ workflow（工作流）/ auto（自动探测）
  app_type: "auto"
  # 应用为工作流时，接收文本的输入变量名（在 Dify 工作流的开始节点里查看）
  workflow_input_key: "query"
  # 请求超时秒数
  timeout: 60

deepseek:
  # DeepSeek 官方 API 为 https://api.deepseek.com/v1；公司内网部署则填内网地址
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  # deepseek-chat（V3 系列，支持 function calling）/ deepseek-reasoner（R1 推理模型）
  model: "deepseek-chat"
  timeout: 60

server:
  # Web 聊天界面监听地址与端口
  host: "127.0.0.1"
  port: 8600

den_platform:
  # DEN执行质量辅助复核平台 的本地服务地址（默认端口 8799）
  base_url: "http://127.0.0.1:8799"
  # 平台 EXE 路径；填写后 Skill 会在服务未启动时自动拉起平台
  # 例如: C:/Users/USER\Desktop\DEN_DOWNLOAD\release-latest\DEN执行质量辅助复核平台.exe
  exe_path: ""
  # 自动拉起后等待服务就绪的最长秒数
  start_wait_seconds: 90

dingtalk:
  # 钉钉机器人（企业内部应用）的 AppKey / AppSecret，Stream 模式
  client_id: ""
  client_secret: ""
