<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'"><title>业务浏览器导航栏</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#edf2f7;color:#17324d}#tabs{display:flex;height:42px;gap:5px;padding:6px 8px;overflow:auto}button{border:1px solid #c7d3df;background:#fff;border-radius:6px;padding:5px 10px;color:inherit;cursor:pointer}button[aria-selected=true]{background:#dbeafe;border-color:#6b9bd2}.tab{display:flex;flex-shrink:0;max-width:220px}.tab button:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tab button:last-child{padding:3px 7px}form{display:flex;gap:6px;height:50px;padding:6px 8px 10px}input{min-width:100px;flex:1;border:1px solid #b7c5d5;border-radius:7px;padding:7px 10px;font:14px system-ui}#error{color:#a11212;font-size:12px}</style>
<div id="tabs" role="tablist" aria-label="打开的页面"></div><form id="address-form"><button type="button" id="back" title="后退">←</button><button type="button" id="forward" title="前进">→</button><button type="button" id="reload" title="刷新">↻</button><input id="address" aria-label="当前页面地址" placeholder="输入 http(s) 网址"><button type="submit">前往</button><button type="button" id="copy">复制链接</button><button type="button" id="devtools" title="F12 / Ctrl+Shift+I">开发者工具</button><span id="error" role="status"></span></form><script src="browser-toolbar.js"></script></html>
